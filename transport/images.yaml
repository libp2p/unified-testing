    secureChannels: [noise]
    muxers: [mplex, yamux]
    dialOnly: [wss, webrtc-direct]

  # Firefox and WebKit allow SDP munging, so they dial WebRTC Direct v1 by
  # default; these force v2
  - id: firefox-js-v3.x-webrtc-direct-v2
    source:
      type: browser
      baseImage: js-v3.x
