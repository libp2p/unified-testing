# Transport Interop - Implementation Definitions
# This file defines all libp2p implementations to test for transport interoperability

# Test Aliases - Define reusable patterns for test selection
# Usage: --test-select "~browsers" or --test-ignore "!~browsers"
test-aliases:
  - alias: "all"
    value: "~browsers|~rust|~go|~python|~js|~nim|~jvm|~c|~dotnet|~zig|~eth-p2p|~lua|~haskell"
  - alias: "browsers"
    value: "chromium-rust-v0.53|chromium-rust-v0.54|chromium-rust-v0.56|chromium-js-v1.x|chromium-js-v2.x|chromium-js-v3.x|chromium-js-v3.x-no-sdp-mangle-ufrag|firefox-js-v1.x|firefox-js-v2.x|firefox-js-v3.x|webkit-js-v1.x|webkit-js-v2.x|webkit-js-v3.x|firefox-js-v3.x-webrtc-direct-v2|webkit-js-v3.x-webrtc-direct-v2"
  - alias: "rust-browsers"
    value: "chromium-rust-v0.53|chromium-rust-v0.54"
  - alias: "js-browsers"
    value: "chromium-js-v1.x|chromium-js-v2.x|chromium-js-v3.x|chromium-js-v3.x-no-sdp-mangle-ufrag|firefox-js-v1.x|firefox-js-v2.x|firefox-js-v3.x|webkit-js-v1.x|webkit-js-v2.x|webkit-js-v3.x|firefox-js-v3.x-webrtc-direct-v2|webkit-js-v3.x-webrtc-direct-v2"
  - alias: "rust"
    value: "rust-v0.53|rust-v0.54|rust-v0.55|rust-v0.56"
  - alias: "go"
    value: "go-v0.38|go-v0.39|go-v0.40|go-v0.41|go-v0.42|go-v0.43|go-v0.44|go-v0.45|go-v0.46|go-v0.47-pre|go-v0.47|go-v0.48|go-v0.49|go-v0.50|go-v0.51|go-v0.52|go-v0.52-webrtc-direct-v2"
  - alias: "python"
    value: "python-v0.x"
  - alias: "js"
    value: "js-v1.x|js-v2.x|js-v3.x|js-v3.x-webrtc-direct-v2"
  - alias: "nim"
    value: "nim-v2.2.0"
  - alias: "haskell"
    value: "haskell-v0.1"
  - alias: "jvm"
    value: "jvm-v1.2"
  - alias: "c"
    value: "c-v0.0.1"
  - alias: "dotnet"
    value: "dotnet-v1.0"
  - alias: "zig"
    value: "zig-v0.0.1"
  - alias: "eth-p2p"
    value: "eth-p2p-z-v0.0.1|eth-p2p-z-v0.0.2"
  - alias: "lua"
    value: "lua-v0.1.0"
  # Known-failing tests, ignored by the PR and daily runs. Entries match as
  # substrings of test names ("dialer x listener (transport, ...)"), so an ID
  # here also hides tests for IDs that contain it (js-v3.x would hide
  # js-v3.x-webrtc-direct-v2).
  # The WebRTC Direct v2 dialers (*-webrtc-direct-v2,
  # chromium-js-v3.x-no-sdp-mangle-ufrag) cannot connect to v1-only listeners
  # (go-v0.48 and older, rust-v0.53..v0.55: the webrtc-direct listeners without
  # v2 support). Those are ignored as a whole here;
  # if one is removed, add "<v2 dialer> x <listener>" entries for it.
  # "webkit-js-v3.x x firefox-js-v3.x (webrtc)" (browser to browser through a
  # relay) is flaky: WebKit's data channel sometimes fails to send (2 of 4 local
  # runs, 26 Nov 2026).
  - alias: "failing"
    value: "chromium-rust-v0.53|chromium-rust-v0.54|chromium-rust-v0.56|chromium-js-v1.x|chromium-js-v2.x|firefox-js-v1.x|firefox-js-v2.x|webkit-js-v1.x|webkit-js-v2.x|go-v0.38|go-v0.39|go-v0.40|go-v0.41|go-v0.42|go-v0.43|go-v0.44|go-v0.45|go-v0.46|go-v0.47-pre|go-v0.47|go-v0.48|~jvm|~c|~dotnet|~zig|eth-p2p-z-v0.0.1|rust-v0.53|rust-v0.54|rust-v0.55|lua-v0.1.0 x python-v0.x|js-v1.x|webkit-js-v3.x x firefox-js-v3.x (webrtc)"

