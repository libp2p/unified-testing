  # Chromium with ICE ufrag/pwd SDP munging disabled, as Chrome may ship it
  # (libp2p/specs#672). WebRTC Direct v1 needs munging, so js-libp2p falls back
  # from v1 to v2.
  - id: chromium-js-v3.x-no-sdp-mangle-ufrag
    source:
      type: browser
      baseImage: js-v3.x
      browser: chromium
      dockerfile: images/js/v3.x/ChromiumNoSdpMangleUfragDockerfile
